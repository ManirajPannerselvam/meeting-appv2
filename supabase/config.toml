# ============================================================
# Temple Operations Reporting System
# Supabase Local Configuration
# ============================================================

project_id = "temple-operations-reporting"

# ============================================================
# API
# ============================================================

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# ============================================================
# DATABASE
# ============================================================

[db]
port = 54322
major_version = 17

# ============================================================
# DATABASE MIGRATIONS
# ============================================================

[db.migrations]
enabled = true

# ============================================================
# STUDIO
# ============================================================

[studio]
enabled = true
port = 54323

# ============================================================
# INBUILT STORAGE
# ============================================================

[storage]
enabled = true
file_size_limit = "50MiB"

# ============================================================
# AUTH
# ============================================================

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
    "http://localhost:5173/**",
    "http://127.0.0.1:5173/**"
]

# JWT expiry: 1 hour
jwt_expiry = 3600

enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# ============================================================
# EMAIL AUTH / OTP
# ============================================================

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1m"

# ============================================================
# EMAIL OTP
# ============================================================

[auth.email.template.magic_link]
subject = "Temple Operations Reporting System Login"

# ============================================================
# REALTIME
# ============================================================

[realtime]
enabled = true

# ============================================================
# EDGE FUNCTIONS
# ============================================================

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# ============================================================
# ANALYTICS
# ============================================================

[analytics]
enabled = false

# ============================================================
# VECTOR / EXPERIMENTAL FEATURES
# ============================================================

[experimental]