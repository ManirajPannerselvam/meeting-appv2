<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORG - Tauri + SvelteKit</title>
    %sveltekit.head%
    <style>
      #app-initial-loader {
        position: fixed;
        inset: 0;
        background: #111827;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      #app-initial-loader.hide {
        opacity: 0;
        visibility: hidden;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .handshake-anim {
        display: flex;
        align-items: center;
        gap: 2px;
        font-size: 56px;
        animation: handshakeShake 0.9s ease-in-out infinite;
      }
      @keyframes handshakeShake {
        0%, 100% { transform: translateY(0) scale(1); }
        25% { transform: translateY(-4px) scale(1.05) rotate(-2deg); }
        50% { transform: translateY(0) scale(1.1) rotate(0deg); }
        75% { transform: translateY(-2px) scale(1.05) rotate(2deg); }
      }
      .loader-brand {
        color: #22c55e;
        font-weight: 900;
        font-size: 28px;
        letter-spacing: 8px;
        font-family: "Segoe UI", sans-serif;
      }
      .loader-dots {
        display: flex;
        gap: 6px;
      }
      .loader-dots span {
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        animation: loaderDot 1s infinite;
      }
      .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
      .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes loaderDot {
        0%, 100% { transform: translateY(0); opacity: 0.4; }
        50% { transform: translateY(-8px); opacity: 1; }
      }
      .loader-bar {
        width: 140px;
        height: 3px;
        background: #1f2937;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 6px;
      }
      .loader-bar-fill {
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #22c55e, #16a34a);
        border-radius: 10px;
        animation: loaderSlide 1.2s ease-in-out infinite;
      }
      @keyframes loaderSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- HANDSHAKE LOADING ANIMATION -->
    <div id="app-initial-loader">
      <div class="loader-content">
        <div class="handshake-anim">🤝</div>
        <div class="loader-brand">ORG</div>
        <div class="loader-dots"><span></span><span></span><span></span></div>
        <div class="loader-bar"><div class="loader-bar-fill"></div></div>
      </div>
    </div>

    <div style="display: contents">%sveltekit.body%</div>

    <script>
      // Hide loader after SvelteKit hydrates
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('app-initial-loader');
          if (loader) {
            loader.classList.add('hide');
            setTimeout(function(){ loader.remove(); }, 500);
          }
        }, 1200);
      });
      // Fallback - hide after 3s max
      setTimeout(function(){
        var loader = document.getElementById('app-initial-loader');
        if (loader && !loader.classList.contains('hide')) {
          loader.classList.add('hide');
          setTimeout(function(){ loader.remove(); }, 500);
        }
      }, 3000);
    </script>
  </body>
</html>
